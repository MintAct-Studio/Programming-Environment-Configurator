name: Release

# 手动触发，不监听 tag。
#
# 原因：本地构建的包是拿证书库里的证书签过名的，CI 里没有证书只能出未签名包。
# 如果监听 tag，网页上建 v0.9.0 时会同时触发这里，把同名附件覆盖成未签名版本。
#
# 什么时候用这个工作流：
#   - 手头没有签名证书 / 在别的机器上补一个包
#   - 只是想验证打包流程能不能跑通
# 需要签名版本时，请用本地 npm run dist + npm run sign:artifacts。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂到哪个 tag（例如 v0.9.0，需已存在）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验多语言词典
        run: npm run i18n:check

      - name: 打包（不签名）
        run: npm run dist
        env:
          # 没有证书；同时跳过 electron-builder 默认要连的时间戳服务器
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_OFFLINE: 'true'

      - name: 产物清单
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          overwrite_files: true
          files: |
            dist/*.exe
            dist/latest.yml
          body: |
            由 GitHub Actions 自动构建，**未签名**（SmartScreen 会提示未知发布者）。

            校验和见 `latest.yml`。
